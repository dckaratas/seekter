name: tests

# scripts/seekter.mjs is the one part of this kit that can lose an application:
# dedup that misses a duplicate costs a second submission to a company that
# already rejected you, and a status change that rewrites the wrong file costs
# the record of what was sent. The suite needs no packages and runs the real
# script against a throwaway repository, so there is nothing to install.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the README promises; 22 is the current LTS. Windows because
        # line endings and path separators are where a port like this breaks.
        os: [ubuntu-latest, windows-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run the tracker tests
        run: node --test tests/seekter.test.mjs
